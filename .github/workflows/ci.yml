name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the GitHub Release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nvlide-debug
          path: app/build/outputs/apk/debug/*.apk

      # v* tags only: a signed release APK, published as a GitHub Release. Every release must use the same key
      # (the NVLIDE_KEY* secrets), or installed copies can't update, so a tag without it fails instead of
      # publishing an unsigned APK.
      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.NVLIDE_KEYSTORE_BASE64 }}
          NVLIDE_KEYSTORE_PASSWORD: ${{ secrets.NVLIDE_KEYSTORE_PASSWORD }}
          NVLIDE_KEY_ALIAS: ${{ secrets.NVLIDE_KEY_ALIAS }}
          NVLIDE_KEY_PASSWORD: ${{ secrets.NVLIDE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NVLIDE_KEYSTORE_BASE64 secret missing: refusing to release an unsigned APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export NVLIDE_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "nvlide-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "nvlide-${GITHUB_REF_NAME#v}.apk" --title "nvlide ${GITHUB_REF_NAME#v}" --generate-notes
